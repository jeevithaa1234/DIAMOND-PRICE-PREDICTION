{% extends "base.html" %}

{% block title %}Diamond Price Prediction{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/prediction.css') }}">
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="prediction-card">

        <h2 class="text-center mb-4">
            Diamond Price Prediction
        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Carat</label>
                    <input type="number" step="0.01" name="carat" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Depth</label>
                    <input type="number" step="0.01" name="depth" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Table</label>
                    <input type="number" step="0.01" name="table" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>X</label>
                    <input type="number" step="0.01" name="x" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Y</label>
                    <input type="number" step="0.01" name="y" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Z</label>
                    <input type="number" step="0.01" name="z" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Cut</label>
                    <select class="form-select" name="cut" required>
                        <option>Fair</option>
                        <option>Good</option>
                        <option>Very Good</option>
                        <option>Premium</option>
                        <option>Ideal</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Color</label>
                    <select class="form-select" name="color" required>
                        <option>D</option>
                        <option>E</option>
                        <option>F</option>
                        <option>G</option>
                        <option>H</option>
                        <option>I</option>
                        <option>J</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Clarity</label>
                    <select class="form-select" name="clarity" required>
                        <option>I1</option>
                        <option>SI2</option>
                        <option>SI1</option>
                        <option>VS2</option>
                        <option>VS1</option>
                        <option>VVS2</option>
                        <option>VVS1</option>
                        <option>IF</option>
                    </select>
                </div>

            </div>

            <button class="btn btn-primary w-100 mt-3">

                Predict Price

            </button>

        </form>

    </div>

</div>

{% endblock %}
